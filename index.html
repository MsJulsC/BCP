<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BCP Builder — Version 8</title>
<style>
:root{--ink:#1f2937;--muted:#64748b;--line:#d8dee7;--panel:#f7f9fc;--brand:#1f4e79;--accent:#0f766e;--warn:#a16207;--danger:#b42318;--ok:#166534;--white:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#eef2f6;color:var(--ink)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{max-width:1280px;margin:0 auto;padding:22px}.topbar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 18px;display:flex;gap:16px;align-items:center;justify-content:space-between;box-shadow:0 2px 8px #0000000a}
.brand{font-size:21px;font-weight:700;color:var(--brand)}.sub{font-size:12px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #b8c3d1;background:#fff;border-radius:8px;padding:9px 12px;color:var(--ink)}.btn:hover{background:#f5f7fa}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.teal{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.warn{background:#fff7df;border-color:#e2b94d;color:#7c5200}.btn.danger{background:#fff0ef;border-color:#e2a29d;color:#9d241a}
.statusbar{margin-top:12px;padding:10px 14px;border-radius:9px;border:1px solid #b7d7c2;background:#edf9f0;color:var(--ok);font-size:13px}.statusbar.warn{border-color:#e2b94d;background:#fff8e6;color:#7c5200}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:14px;box-shadow:0 2px 8px #00000008}
h1{font-size:24px;margin:0 0 6px;color:var(--brand)}h2{font-size:18px;margin:0 0 8px}h3{font-size:14px;margin:16px 0 7px}.lead{color:#475569;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px}.metric b{display:block;font-size:21px}.metric span{font-size:11px;color:var(--muted)}
.dashboard-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.service-card{border:1px solid var(--line);border-radius:11px;padding:15px;background:#fff;cursor:pointer}.service-card:hover{border-color:#8aa6c2;box-shadow:0 3px 12px #0000000d}.service-card h3{margin:0 0 8px;font-size:16px;color:var(--brand)}
.badge{font-size:11px;border-radius:999px;padding:4px 8px;display:inline-block;font-weight:700}.badge.ok{background:#e8f5ed;color:var(--ok)}.badge.warn{background:#fff2d6;color:#805500}.badge.danger{background:#fde9e7;color:#a02b22}.badge.info{background:#e8f0fb;color:#285b91}
.service-meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.service-meta div{background:#f8fafc;border-radius:7px;padding:8px}.service-meta b{display:block;font-size:15px}.service-meta span{font-size:10px;color:var(--muted)}
.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid #c7d0dc;border-radius:7px;padding:9px;background:#fff}.field textarea{min-height:72px;resize:vertical}
.scenario{border:1px solid var(--line);border-radius:9px;margin:8px 0;overflow:hidden}.scenario-head{padding:12px;background:#f7f9fc;display:flex;justify-content:space-between;align-items:center;gap:10px}.scenario-head b{font-size:14px}.pill{font-size:11px;border-radius:999px;padding:4px 8px;background:#e8f5ed;color:var(--ok)}.pill.open{background:#fff2d6;color:#805500}.scenario-body{padding:14px}.prompt{background:#f8fafc;border-left:4px solid var(--brand);padding:10px;margin:8px 0}.prompt b{font-size:12px}.small{font-size:12px;color:var(--muted)}
.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{border:1px solid var(--line);padding:8px;vertical-align:top;text-align:left}.table th{background:#f1f5f9}.table tr.clickable{cursor:pointer}.table tr.clickable:hover{background:#f8fafc}
.flow{display:flex;gap:7px;align-items:stretch;flex-wrap:wrap}.flow .step{flex:1;min-width:130px;border:1px solid var(--line);background:#f8fafc;border-radius:9px;padding:10px;text-align:center;font-size:12px}.arrow{align-self:center;color:var(--brand);font-weight:700}
.alert{border:1px solid #e2b94d;background:#fff8e6;border-radius:9px;padding:12px;color:#7c5200}.success{border:1px solid #b7d7c2;background:#edf9f0;border-radius:9px;padding:12px;color:var(--ok)}.dangerbox{border:1px solid #e2a29d;background:#fff0ef;border-radius:9px;padding:12px;color:#9d241a}
.bar{height:9px;border-radius:99px;background:#e8edf3;overflow:hidden}.bar>span{display:block;height:100%;background:#1f4e79}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}.section-title{display:flex;justify-content:space-between;gap:10px;align-items:center}
.footer{color:#718096;font-size:11px;padding:18px 2px;text-align:center}.hidden{display:none!important}
@media(max-width:900px){.grid,.fieldgrid,.service-grid,.dashboard-grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.grid,.fieldgrid,.service-grid,.dashboard-grid{grid-template-columns:1fr}.app{padding:10px}.topbar{align-items:flex-start;flex-direction:column}}
@media print{body{background:#fff}.app{max-width:none;padding:0}.no-print{display:none!important}.card{box-shadow:none;break-inside:avoid}.topbar{box-shadow:none}}
</style>
</head>
<body>
<div class="app"><div id="app"></div><div class="footer">BCP Builder — Version 8 visual prototype • Fictional test services • For review and discussion only</div></div>

<script>
const scenarios=[
"Loss of all or a significant part of the building","Loss of Kitchen","Loss of individual bedroom(s)",
"Staffing levels","Outbreak of contagious illness / Working through a Pandemic","Loss of Electricity",
"Loss of Gas Supply","Water or sewerage supply","Heating & hot water","Breakdown of essential white goods",
"Loss of landline telephone","Computer system","IT failure","Loss of paper records","Loss of key partner or supplier",
"Fuel Shortage","Extreme Weather Conditions"
];

const demoServices={
oak:{
name:"Oakfield House",region:"Region A",division:"Division 1",area:"Alpha",
status:"ok",statusText:"Current & tested",review:"Current",reviewDate:"30 September 2026",
lastUpdate:"06 August 2026",printed:"06 August 2026",complete:17,actions:0,events:1,
summary:"BCP is complete and recently tested. One learning event is recorded and closed.",
learning:[
{date:"06/08/2026",type:"Planned exercise",scenario:"Loss of Electricity",learning:"The emergency lighting and grab-bag arrangements worked as expected. Staff knew the immediate escalation route.",update:"NO",action:"Closed"}
],
themes:["Emergency arrangements tested successfully"]
},
river:{
name:"Riverside Lodge",region:"Region A",division:"Division 1",area:"Alpha",
status:"warn",statusText:"Actions outstanding",review:"Current",reviewDate:"15 October 2026",
lastUpdate:"04 August 2026",printed:"04 August 2026",complete:17,actions:4,events:2,
summary:"A real electricity disruption identified weaknesses in contingency arrangements. Four actions remain open.",
learning:[
{date:"03/08/2026",type:"Real incident",scenario:"Loss of Electricity",learning:"The initial response was safe, but alternative charging arrangements and communication with families were not clear enough.",update:"YES",action:"Update BCP Scenario"},
{date:"20/07/2026",type:"Planned exercise",scenario:"Staffing levels",learning:"Bank contacts were available but the escalation threshold for prolonged shortage needed clearer definition.",update:"YES",action:"Update BCP Scenario"}
],
themes:["Alternative communication arrangements","Staffing escalation threshold"]
},
meadow:{
name:"Meadow View",region:"Region A",division:"Division 1",area:"Bravo",
status:"danger",statusText:"Review overdue",review:"Overdue",reviewDate:"31 July 2026",
lastUpdate:"14 June 2026",printed:"10 June 2026",complete:14,actions:2,events:1,
summary:"Review is overdue and three continuity scenarios still require service-specific information.",
learning:[
{date:"11/06/2026",type:"Planned exercise",scenario:"Loss of all or a significant part of the building",learning:"Alternative accommodation details need confirming and the grab-bag check needs strengthening.",update:"YES",action:"Update BCP Scenario"}
],
themes:["Alternative accommodation","Grab-bag assurance"]
}
};
let currentService="oak",screen="overview";
let serviceData=JSON.parse(localStorage.getItem("bcp8_services")||"null")||JSON.parse(JSON.stringify(demoServices));

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function save(){localStorage.setItem("bcp8_services",JSON.stringify(serviceData));}
function today(){return new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric"});}
function svc(){return serviceData[currentService];}
function setScreen(s){screen=s;render();window.scrollTo({top:0,behavior:"smooth"});}
function setService(id){currentService=id;screen="serviceHome";render();window.scrollTo({top:0,behavior:"smooth"});}
function badge(status,text){return `<span class="badge ${status}">${text}</span>`;}
function header(title,serviceMode=false){
 const s=svc();
 return `<div class="topbar">
 <div><div class="brand">Business Continuity Plan Builder</div><div class="sub">${serviceMode?`Service: ${esc(s.name)}`:"Organisational Business Continuity Plan Overview"} • Version 8 prototype</div></div>
 <div class="actions no-print">
 <button class="btn" onclick="setScreen('overview')">Overview</button>
 ${serviceMode?`<button class="btn" onclick="setScreen('serviceHome')">Service Home</button><button class="btn" onclick="setScreen('learning')">Learning Log</button><button class="btn" onclick="printBCP()">Print BCP</button>`:""}
 </div></div>
 ${serviceMode&&s.lastUpdate!==s.printed?`<div class="statusbar warn">⚠ <b>PRINT REQUIRED</b> — ${esc(s.name)} has changed since its grab-bag copy was printed.</div>`:serviceMode?`<div class="statusbar">✓ Grab-bag copy current — live BCP matches printed version for ${esc(s.name)}.</div>`:""}
 <div class="card"><h1>${title}</h1></div>`;
}

function overview(){
 const list=Object.values(serviceData), current=list.filter(s=>s.review==="Current").length, overdue=list.filter(s=>s.review==="Overdue").length;
 const actions=list.reduce((a,s)=>a+s.actions,0), events=list.reduce((a,s)=>a+s.events,0);
 const allLogs=list.flatMap(s=>s.learning.map(l=>({...l,service:s.name})));
 const themeCounts={};
 allLogs.forEach(l=>{if(l.learning.toLowerCase().includes("alternative accommodation"))themeCounts["Alternative accommodation"]=(themeCounts["Alternative accommodation"]||0)+1;
 if(l.learning.toLowerCase().includes("staff"))themeCounts["Staffing contingency"]=(themeCounts["Staffing contingency"]||0)+1;
 if(l.learning.toLowerCase().includes("grab-bag")||l.learning.toLowerCase().includes("grab bag"))themeCounts["Grab-bag assurance"]=(themeCounts["Grab-bag assurance"]||0)+1;
 if(l.scenario==="Loss of Electricity")themeCounts["Loss of electricity"]=(themeCounts["Loss of electricity"]||0)+1;});
 const themes=Object.entries(themeCounts).sort((a,b)=>b[1]-a[1]);
 return header("Organisational Business Continuity Plan Overview")+`
 <div class="card">
  <div class="kicker">Live assurance position — demonstration data</div>
  <p class="lead">A single view of service BCP status, learning, actions and recurring themes. Select a service to open its BCP and follow learning back into the relevant continuity scenario.</p>
  <div class="grid">
   <div class="metric"><b>${current}/${list.length}</b><span>BCPs current</span></div>
   <div class="metric"><b>${overdue}</b><span>Review overdue</span></div>
   <div class="metric"><b>${actions}</b><span>Open learning actions</span></div>
   <div class="metric"><b>${events}</b><span>Recorded events / tests</span></div>
  </div>
 </div>
  <div class="card">
  <h2>Organisational structure</h2>
  <p class="lead">Select a region to view its divisions, areas and services.</p>

  <details>
   <summary><b>Region A</b></summary>

   <div style="margin:12px 0 0 18px">
    <details>
     <summary><b>Division 1</b></summary>
     <div style="margin:10px 0 10px 18px">
      <p><b>Alpha</b> — Windermere House · Scafell House</p>
      <p><b>Bravo</b> — Ullswater House · Helvellyn House</p>
      <p><b>Charlie</b> — Derwentwater House · Skiddaw House</p>
      <p><b>Delta</b> — Coniston House · Blencathra House</p>
      <p><b>Echo</b> — Buttermere House · Great Gable House</p>
     </div>
    </details>

    <details>
     <summary><b>Division 2</b></summary>
     <div style="margin:10px 0 10px 18px">
      <p><b>Foxtrot</b> — Grasmere House · Catbells House</p>
      <p><b>Golf</b> — Bassenthwaite House · Fairfield House</p>
      <p><b>Hotel</b> — Haweswater House · High Street House</p>
      <p><b>India</b> — Wastwater House · Great End House</p>
      <p><b>Juliet</b> — Ennerdale House · Pillar House</p>
     </div>
    </details>
   </div>
  </details>

  <details style="margin-top:10px">
   <summary><b>Region B</b></summary>

   <div style="margin:12px 0 0 18px">
    <details>
     <summary><b>Division 3</b></summary>
     <div style="margin:10px 0 10px 18px">
      <p><b>Kilo</b> — Bala House · Snowdon House</p>
      <p><b>Lima</b> — Llyn Tegid House · Cadair Idris House</p>
      <p><b>Mike</b> — Wye House · Malvern House</p>
      <p><b>November</b> — Severn House · Cleeve House</p>
      <p><b>Oscar</b> — Avon House · Mendip House</p>
     </div>
    </details>

    <details>
     <summary><b>Division 4</b></summary>
     <div style="margin:10px 0 10px 18px">
      <p><b>Papa</b> — Loch Lomond House · Ben Lomond House</p>
      <p><b>Quebec</b> — Loch Ness House · Ben Nevis House</p>
      <p><b>Romeo</b> — Loch Katrine House · Ben Lawers House</p>
      <p><b>Sierra</b> — Tay House · Schiehallion House</p>
      <p><b>Tango</b> — Dee House · Cairngorm House</p>
     </div>
    </details>
   </div>
  </details>
 </div>
 <div class="dashboard-grid">
  <div class="card">
   <div class="section-title"><div><h2>Service status</h2><div class="small">Click a service to open its BCP</div></div><button class="btn no-print" onclick="resetDemo()">Reset demo data</button></div>
   <div class="service-grid" style="margin-top:12px">
    ${Object.entries(serviceData).map(([id,s])=>`<div class="service-card" onclick="setService('${id}')">
      <h3>${esc(s.name)}</h3>${badge(s.status,s.statusText)}
      <div class="service-meta">
       <div><b>${s.complete}/17</b><span>Scenarios complete</span></div>
       <div><b>${s.actions}</b><span>Open actions</span></div>
       <div><b>${s.events}</b><span>Events/tests</span></div>
       <div><b>${esc(s.reviewDate)}</b><span>Review date</span></div>
      </div>
      <p class="small">${esc(s.summary)}</p>
     </div>`).join("")}
   </div>
  </div>
  <div class="card">
   <h2>Attention required</h2>
   ${Object.values(serviceData).filter(s=>s.status!=="ok").map(s=>`<div class="${s.status==="danger"?'dangerbox':'alert'}" style="margin:9px 0">
    <b>${esc(s.name)}</b><br>${esc(s.statusText)} • ${s.actions} open action${s.actions===1?'':'s'}
    <div style="margin-top:7px"><button class="btn" onclick="setService('${Object.keys(serviceData).find(k=>serviceData[k].name===s.name)}')">Open service</button></div>
   </div>`).join("")}
  </div>
 </div>
 <div class="card">
  <div class="section-title"><div><h2>Learning & incidents</h2><div class="small">A cross-service view of recorded tests and real-life events</div></div></div>
  <table class="table"><tr><th>Date</th><th>Service</th><th>Type</th><th>Scenario</th><th>Learning / issue</th><th>BCP update?</th></tr>
   ${allLogs.sort((a,b)=>b.date.localeCompare(a.date)).map(l=>`<tr class="clickable" onclick="openLogService('${Object.keys(serviceData).find(k=>serviceData[k].name===l.service)}')"><td>${esc(l.date)}</td><td><b>${esc(l.service)}</b></td><td>${esc(l.type)}</td><td>${esc(l.scenario)}</td><td>${esc(l.learning)}</td><td>${l.update==="YES"?badge("warn","YES — action"):badge("ok","NO")}</td></tr>`).join("")}
  </table>
 </div>
 <div class="card">
  <h2>Organisation-wide learning themes</h2>
  <p class="lead">The dashboard can surface repeated weaknesses so that learning is not isolated within individual services.</p>
  ${themes.length?themes.map(([t,n])=>`<div style="margin:12px 0"><div class="section-title"><b>${esc(t)}</b><span class="small">${n} occurrence${n===1?'':'s'}</span></div><div class="bar"><span style="width:${Math.min(100,n*35)}%"></span></div></div>`).join(""):`<div class="success">No recurring themes identified in the demonstration data.</div>`}
 </div>
 <div class="card">
  <h2>The assurance loop</h2>
  <div class="flow">
   <div class="step"><b>Test or real incident</b><br>Record what happened</div><div class="arrow">→</div>
   <div class="step"><b>Learning Log</b><br>Capture what worked / did not</div><div class="arrow">→</div>
   <div class="step"><b>Does BCP need updating?</b><br>Yes / No</div><div class="arrow">→</div>
   <div class="step"><b>YES → Scenario</b><br>Update the relevant plan</div><div class="arrow">→</div>
   <div class="step"><b>Print required</b><br>Replace grab-bag copy</div>
  </div>
 </div>`;
}

function serviceHome(){
 const s=svc(), stale=s.lastUpdate!==s.printed;
 return header("Service BCP — "+esc(s.name),true)+`
 <div class="card">
  <div class="grid">
   <div class="metric"><b>${s.complete}/17</b><span>Continuity scenarios complete</span></div>
   <div class="metric"><b>${s.actions}</b><span>Open learning actions</span></div>
   <div class="metric"><b>${s.events}</b><span>Tests / incidents logged</span></div>
   <div class="metric"><b>${esc(s.reviewDate)}</b><span>Next review</span></div>
  </div>
  <div class="actions no-print" style="margin-top:14px">
<button class="btn primary" onclick="setScreen('info')">Open / Edit BCP</button>
   <button class="btn teal" onclick="setScreen('learning')">Open Learning Log</button>
   <button class="btn" onclick="setScreen('scenarios')">Continuity Scenarios</button>
   <button class="btn warn" onclick="printBCP()">Print / Grab-bag</button>
  </div>
 </div>
 <div class="card">
  <div class="section-title"><h2>Service assurance summary</h2>${badge(s.status,s.statusText)}</div>
  <p class="lead">${esc(s.summary)}</p>
  <div class="${s.actions?'alert':'success'}"><b>${s.actions?'Attention required':'No open learning actions'}</b><br>
  ${s.actions?`There ${s.actions===1?'is':'are'} ${s.actions} learning action${s.actions===1?'':'s'} requiring follow-through.`:"Current demonstration data shows no open learning actions."}</div>
 </div>
 <div class="card"><h2>Recent learning</h2>${s.learning.map((l,i)=>`<div class="scenario"><div class="scenario-head"><b>${esc(l.type)} — ${esc(l.scenario)}</b>${l.update==="YES"?badge("warn","BCP update required"):badge("ok","No BCP update")}</div><div class="scenario-body"><p>${esc(l.learning)}</p>${l.update==="YES"?`<button class="btn primary no-print" onclick="rebranch(${i})">Follow learning back to BCP scenario</button>`:""}</div></div>`).join("")}</div>`;
}

function info(){
 const s=svc();
 return header("Service Information — "+esc(s.name),true)+`
 <div class="card"><div class="fieldgrid">
 ${field("Service name","name")}${field("Review date","reviewDate")}${field("Next review / last update","lastUpdate")}${field("Grab-bag print date","printed")}
 </div><h3>Emergency reference information</h3><div class="fieldgrid">
 ${field("Main contact number","phone")}${field("Registered Manager","manager")}${field("Emergency assembly point","assembly")}${field("Alternative assembly point","assembly2")}
 ${field("Emergency grab bag location","grab")}${field("Gas isolation point","gas")}${field("Electricity isolation point","electric")}${field("Water isolation point","water")}
 </div>
 <div class="actions no-print" style="margin-top:14px"><button class="btn primary" onclick="saveInfo()">Save & Continue</button><button class="btn" onclick="setScreen('serviceHome')">Back</button></div></div>`;
}
function field(label,key){return `<div class="field"><label>${label}</label><input id="f_${key}" value="${esc(svc()[key]||"")}"></div>`}
function saveInfo(){
 const s=svc();["name","reviewDate","lastUpdate","printed","phone","manager","assembly","assembly2","grab","gas","electric","water"].forEach(k=>{let e=document.getElementById("f_"+k);if(e)s[k]=e.value});
save();setScreen('scenarios');
}

function scenariosView(){
  const s=svc();
  s.answers=Array.isArray(s.answers)?s.answers:[];

  const completed=s.answers.filter(a=>a && a.trim()).length;

  return header("Continuity Scenarios — "+esc(s.name),true)+
  `
  <div class="card">

    <div class="alert">
      <b>Continuity scenario completion</b><br>
      Work through each scenario and record the arrangements that apply specifically
      to this service. The aim is to make sure someone unfamiliar with the service
      could understand what needs to happen during an incident.
    </div>

    <div class="metric" style="margin-bottom:14px">
     <b>${completed} / ${scenarios.length}</b>
      <span>scenarios completed</span>
    </div>

    <div class="scenario-list">

      ${scenarios.map((name,i)=>{
        const answer=s.answers[i]||"";
        const complete=answer.trim().length>0;

        return `
        <div class="scenario" style="margin-bottom:8px">

          <div class="scenario-head"
               style="display:flex;justify-content:space-between;align-items:center;gap:12px">

            <div>
              <b>${i+1}. ${esc(name)}</b>
            </div>

            <div>
              ${complete
                ? badge("ok","Complete")
                : badge("warn","Needs completion")}
            </div>

          </div>

          <div class="scenario-body"
               style="display:flex;justify-content:space-between;align-items:center;gap:15px">

            <div class="small" style="flex:1">
              ${complete
                ? "Service-specific information has been recorded."
                : "No service-specific information has been recorded yet."}
            </div>

            <button class="btn primary"
                    onclick="openScenario(${i})">
              ${complete ? "Review / Edit Scenario" : "Open Scenario"}
            </button>

          </div>

        </div>
        `;
      }).join("")}

    </div>

  </div>
  `;
}
function saveScenario(i){const s=svc();s.answers=Array.isArray(s.answers)?s.answers:[];s.answers[i]=document.getElementById("sc_"+i).value;s.lastUpdate=today();s.actions=Math.max(0,s.actions);save();render();}
function openScenario(i){svc().currentScenario=i;setScreen("scenario");}
function scenario(){
  const s=svc(),i=s.currentScenario||0,name=scenarios[i],a=(s.answers||[])[i]||"";

  return header("Continuity Scenario - "+name,true)+`

  <div class="card">

    <div class="alert">
      <b>Scenario purpose</b><br>
      This section helps you think through what someone on duty would need to know and do if this disruption happened at your service.
      The aim is to capture practical, service-specific information rather than general instructions.
    </div>

    <h3>Prompts for the manager</h3>

    <div class="prompt">
      <b>1. What should happen first?</b><br>
      <span class="small">
        What are the immediate actions the person on duty should take?
        Think about keeping people safe, assessing the situation and escalating appropriately.
      </span>
    </div>

    <div class="prompt">
      <b>2. Who needs to be contacted, and how?</b><br>
      <span class="small">
        Include relevant internal contacts, emergency services, professionals, families,
        suppliers or other key people. Where useful, include names, roles and contact details.
      </span>
    </div>

    <div class="prompt">
      <b>3. Who is most affected by this disruption?</b><br>
      <span class="small">
        Consider people supported at the service, their individual needs, communication,
        mobility, health, routines, behaviours, equipment and any additional risks.
      </span>
    </div>

    <div class="prompt">
      <b>4. What equipment, information or documents might be needed?</b><br>
      <span class="small">
        Think about essential equipment, medication, records, emergency information,
        keys, access arrangements, contact lists and anything else that may be needed quickly.
      </span>
    </div>

    <div class="prompt">
      <b>5. Where is everything located?</b><br>
      <span class="small">
        Be specific. For example: water stop cock, gas isolation point, electrical isolation point,
        fire equipment, emergency grab bag, keys, important documents or alternative equipment.
      </span>
    </div>

    <div class="prompt">
      <b>6. What alternative arrangements would be needed?</b><br>
      <span class="small">
        Consider alternative accommodation, staffing, food, medication, transport,
        equipment, communication or other arrangements.
      </span>
    </div>

    <div class="prompt">
      <b>7. What could make this situation worse?</b><br>
      <span class="small">
        Consider foreseeable risks, vulnerable people, time of day, staffing levels,
        access issues, weather, neighbouring services or other factors that could affect the response.
      </span>
    </div>

    <div class="prompt">
      <b>8. What would someone unfamiliar with this service need to know?</b><br>
      <span class="small">
        Imagine a manager from another service has to take charge. What information would
        they need immediately to make safe and informed decisions?
      </span>
    </div>

    <div class="field">
      <label>Service-specific contingency plan</label>
      <textarea id="fullsc" style="width:100%;min-height:300px"
        placeholder="Use the prompts above to record the practical arrangements for this service.">${esc(a)}</textarea>
    </div>

    <div class="actions no-print" style="margin-top:12px">
      <button class="btn primary" onclick="saveFullScenario()">Save Scenario</button>
      <button class="btn" onclick="setScreen('scenarios')">Back to Scenarios</button>
      <button class="btn teal" onclick="setScreen('learning')">Open Learning Log</button>
    </div>

  </div>`;
}
function saveFullScenario(){const s=svc();s.answers=Array.isArray(s.answers)?s.answers:[];s.answers[s.currentScenario||0]=document.getElementById("fullsc").value;s.lastUpdate=today();save();setScreen("scenarios");}

function learning(){
 const s=svc();
 return header("Testing / Incident & Learning Log — "+esc(s.name),true)+`
 <div class="card"><div class="success"><b>What is this log for?</b><br>This is a live record of how the BCP works in practice. Use it for <b>planned tests/exercises and real incidents or disruptions</b>. Capture what happened, what worked, what did not, whether the BCP gave the person managing the event the information needed, and what should change.<br><br><b>Every test and every significant incident should be used as an opportunity to improve the BCP.</b></div>
 <div class="actions no-print" style="margin-top:12px"><button class="btn primary" onclick="newLog('Planned exercise')">New Test / Exercise</button><button class="btn teal" onclick="newLog('Real incident')">New Real Incident</button></div></div>
 <div class="card"><table class="table"><tr><th>Date</th><th>Type</th><th>Scenario</th><th>Learning</th><th>BCP update?</th><th>Action</th></tr>
 ${s.learning.map((l,i)=>`<tr><td>${esc(l.date)}</td><td>${esc(l.type)}</td><td>${esc(l.scenario)}</td><td>${esc(l.learning)}</td><td>${l.update==="YES"?badge("warn","YES"):badge("ok","NO")}</td><td>${l.update==="YES"?`<button class="btn primary" onclick="rebranch(${i})">Update BCP Scenario</button>`:"Closed"}</td></tr>`).join("")}</table></div>`;
}
function newLog(type){
const s=svc(),n=prompt("Which continuity scenario?\n\n"+scenarios.map((name,i)=>(i+1)+". "+name).join("\n")+"\n\nEnter the scenario number:");
 if(!n)return;let i=Math.max(1,Math.min(scenarios.length,parseInt(n,10)||1))-1;
 const learning=prompt("What happened / what did you learn?");if(learning===null)return;
 const update=confirm("Does this learning require the BCP to be updated?\\n\\nOK = YES\\nCancel = NO")?"YES":"NO";
 s.learning.unshift({date:today(),type,scenario:scenarios[i],learning,update,action:update==="YES"?"Update BCP Scenario":"Closed"});
 s.events++;if(update==="YES")s.actions++;save();render();
}
function rebranch(i){const s=svc(),l=s.learning[i],idx=scenarios.indexOf(l.scenario);s.currentScenario=idx<0?0:idx;setScreen("scenario");}
function openLogService(id){setService(id);setTimeout(()=>setScreen("learning"),50);}
function printBCP(){const s=svc();s.printed=s.lastUpdate;save();setScreen("print");setTimeout(()=>window.print(),350);}
function printControl(){
 const s=svc(),stale=s.lastUpdate!==s.printed;
 return header("BCP Update & Grab-Bag Control — "+esc(s.name),true)+`
 <div class="card">${stale?`<div class="alert"><b>⚠ PRINT REQUIRED</b><br>The live BCP has changed since the grab-bag copy was printed. Print the current version and replace the old copy.</div>`:`<div class="success"><b>✓ Grab-bag copy current</b><br>The printed copy matches the live BCP version recorded in the builder.</div>`}
 <h3>Print confirmation</h3><div class="small">☐ Current BCP printed<br>☐ Old grab-bag copy removed<br>☐ New copy placed in grab bag<br>☐ Update / print date recorded<br>☐ Manager or delegated person confirms replacement</div>
 <div class="actions no-print" style="margin-top:14px"><button class="btn primary" onclick="printBCP()">Print Current BCP</button><button class="btn" onclick="setScreen('serviceHome')">Back to Service</button></div></div>`;
}
function resetDemo(){if(confirm("Reset the three fictional test services to the original demonstration data?")){serviceData=JSON.parse(JSON.stringify(demoServices));save();render();}}
function render(){
 let out=screen==="overview"?overview():screen==="serviceHome"?serviceHome():screen==="info"?info():screen==="scenarios"?scenariosView():screen==="scenario"?scenario():screen==="learning"?learning():printControl();
 document.getElementById("app").innerHTML=out;
}
render();
</script>
</body>
</html>
