<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BCP Builder — Version 8</title>
<style>
:root{--ink:#1f2937;--muted:#64748b;--line:#d8dee7;--panel:#f7f9fc;--brand:#1f4e79;--accent:#0f766e;--warn:#a16207;--danger:#b42318;--ok:#166534;--white:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#eef2f6;color:var(--ink)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{max-width:1280px;margin:0 auto;padding:22px}.topbar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 18px;display:flex;gap:16px;align-items:center;justify-content:space-between;box-shadow:0 2px 8px #0000000a}
.brand{font-size:21px;font-weight:700;color:var(--brand)}.sub{font-size:12px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #b8c3d1;background:#fff;border-radius:8px;padding:9px 12px;color:var(--ink)}.btn:hover{background:#f5f7fa}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.teal{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.warn{background:#fff7df;border-color:#e2b94d;color:#7c5200}.btn.danger{background:#fff0ef;border-color:#e2a29d;color:#9d241a}
.statusbar{margin-top:12px;padding:10px 14px;border-radius:9px;border:1px solid #b7d7c2;background:#edf9f0;color:var(--ok);font-size:13px}.statusbar.warn{border-color:#e2b94d;background:#fff8e6;color:#7c5200}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:14px;box-shadow:0 2px 8px #00000008}
h1{font-size:24px;margin:0 0 6px;color:var(--brand)}h2{font-size:18px;margin:0 0 8px}h3{font-size:14px;margin:16px 0 7px}.lead{color:#475569;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px}.metric b{display:block;font-size:21px}.metric span{font-size:11px;color:var(--muted)}
.dashboard-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.service-card{border:1px solid var(--line);border-radius:11px;padding:15px;background:#fff;cursor:pointer}.service-card:hover{border-color:#8aa6c2;box-shadow:0 3px 12px #0000000d}.service-card h3{margin:0 0 8px;font-size:16px;color:var(--brand)}
.badge{font-size:11px;border-radius:999px;padding:4px 8px;display:inline-block;font-weight:700}.badge.ok{background:#e8f5ed;color:var(--ok)}.badge.warn{background:#fff2d6;color:#805500}.badge.danger{background:#fde9e7;color:#a02b22}.badge.info{background:#e8f0fb;color:#285b91}
.service-meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.service-meta div{background:#f8fafc;border-radius:7px;padding:8px}.service-meta b{display:block;font-size:15px}.service-meta span{font-size:10px;color:var(--muted)}
.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid #c7d0dc;border-radius:7px;padding:9px;background:#fff}.field textarea{min-height:72px;resize:vertical}
.scenario{border:1px solid var(--line);border-radius:9px;margin:8px 0;overflow:hidden}.scenario-head{padding:12px;background:#f7f9fc;display:flex;justify-content:space-between;align-items:center;gap:10px}.scenario-head b{font-size:14px}.pill{font-size:11px;border-radius:999px;padding:4px 8px;background:#e8f5ed;color:var(--ok)}.pill.open{background:#fff2d6;color:#805500}.scenario-body{padding:14px}.prompt{background:#f8fafc;border-left:4px solid var(--brand);padding:10px;margin:8px 0}.prompt b{font-size:12px}.small{font-size:12px;color:var(--muted)}
.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{border:1px solid var(--line);padding:8px;vertical-align:top;text-align:left}.table th{background:#f1f5f9}.table tr.clickable{cursor:pointer}.table tr.clickable:hover{background:#f8fafc}
.flow{display:flex;gap:7px;align-items:stretch;flex-wrap:wrap}.flow .step{flex:1;min-width:130px;border:1px solid var(--line);background:#f8fafc;border-radius:9px;padding:10px;text-align:center;font-size:12px}.arrow{align-self:center;color:var(--brand);font-weight:700}
.alert{border:1px solid #e2b94d;background:#fff8e6;border-radius:9px;padding:12px;color:#7c5200}.success{border:1px solid #b7d7c2;background:#edf9f0;border-radius:9px;padding:12px;color:var(--ok)}.dangerbox{border:1px solid #e2a29d;background:#fff0ef;border-radius:9px;padding:12px;color:#9d241a}
.bar{height:9px;border-radius:99px;background:#e8edf3;overflow:hidden}.bar>span{display:block;height:100%;background:#1f4e79}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}.section-title{display:flex;justify-content:space-between;gap:10px;align-items:center}
.footer{color:#718096;font-size:11px;padding:18px 2px;text-align:center}.hidden{display:none!important}
@media(max-width:900px){.grid,.fieldgrid,.service-grid,.dashboard-grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.grid,.fieldgrid,.service-grid,.dashboard-grid{grid-template-columns:1fr}.app{padding:10px}.topbar{align-items:flex-start;flex-direction:column}}
@page{
  size:A4 portrait;
  margin:16mm 12mm 18mm 12mm;

  @bottom-left{
    content:"Business Continuity Plan — Oakfield House";
    font-size:9pt;
  }

  @bottom-right{
    content:"Page " counter(page) " of " counter(pages);
    font-size:9pt;
  }
}

@media print{
  html,body{
    background:#fff;
    margin:0;
    padding:0;
  }

  .app{
    max-width:none;
    padding:0;
  }

  .no-print{
    display:none!important;
  }

  .card{
    box-shadow:none;
    break-inside:avoid;
  }

  .topbar{
    box-shadow:none;
  }

  .print-cover,
  .print-intro{
    box-sizing:border-box;
    width:100%;
  }

.print-scenario{
  break-before:page;
  width:186mm;
  box-sizing:border-box;
}
}
</style>

async function saveFullScenario(){
  const s=svc();
  const i=s.currentScenario||0;

  s.scenarioAnswers=Array.isArray(s.scenarioAnswers)?s.scenarioAnswers:[];

  const answers=[];

  for(let n=0;n<8;n++){
    answers[n]=document.getElementById("answer_"+n)?.value||"";
  }

  s.scenarioAnswers[i]=answers;

  s.scenarioImages=Array.isArray(s.scenarioImages)?s.scenarioImages:[];

  const existingImages=Array.isArray(s.scenarioImages[i])
    ? s.scenarioImages[i]
    : [];

  const newImages=[];

  for(let n=0;n<5;n++){
    const input=document.getElementById("img_"+n);
    const caption=document.getElementById("imgcap_"+n)?.value.trim();
    const file=input?.files?.[0];

    if(file){
      const url=await new Promise(resolve=>{
        const reader=new FileReader();
        reader.onload=e=>resolve(e.target.result);
        reader.readAsDataURL(file);
      });

      newImages.push({
        url,
        caption
      });

    }else if(existingImages[n]){
      newImages.push({
        url:existingImages[n].url,
        caption
      });
    }
  }

  s.scenarioImages[i]=newImages;

  s.lastUpdate=today();

  save();
  setScreen("scenarios");
}

function preparePrint(){
  const root=document.getElementById("app");
  if(!root) return;

  const cover=root.querySelector(".print-cover");
  const scenarios=Array.from(
    root.querySelectorAll(".print-scenario")
  );

  if(!cover || !scenarios.length) return;

  const mmToPx=96/25.4;

  // A4 printable area with 12mm margins
  const pageWidth=186*mmToPx;
  const pageHeight=263*mmToPx;

  /*
    Create a hidden measurement area using the same
    width as the actual printed page.
  */
  const measure=document.createElement("div");

  measure.style.position="absolute";
  measure.style.left="-100000px";
  measure.style.top="0";
  measure.style.width=pageWidth+"px";
  measure.style.visibility="hidden";
  measure.style.boxSizing="border-box";
  measure.style.background="#fff";

  document.body.appendChild(measure);

  /*
    Clone each scenario into the print-sized area.
    This makes text wrap at the same width as the
    printed document.
  */
  const clones=scenarios.map(scenario=>{

    const clone=scenario.cloneNode(true);

    clone.style.width=pageWidth+"px";
    clone.style.boxSizing="border-box";
    clone.style.display="block";
    clone.style.position="relative";
    clone.style.margin="0";
    clone.style.padding="0";
    clone.style.breakBefore="auto";
    clone.style.pageBreakBefore="auto";

    measure.appendChild(clone);

    return clone;
  });

  /*
    Wait for cloned images to load before measuring.
  */
  const images=Array.from(measure.querySelectorAll("img"));

  const waitForImages=images.map(img=>{
    if(img.complete) return Promise.resolve();

    return new Promise(resolve=>{
      img.addEventListener("load",resolve,{once:true});
      img.addEventListener("error",resolve,{once:true});
    });
  });

  Promise.all(waitForImages).then(()=>{

    /*
      Start after:
      Page 1 = Emergency cover
      Page 2 = BCP information
    */
    let currentPage=5;

    clones.forEach((clone,i)=>{

      const pageCell=cover.querySelector(
        '[data-page="'+i+'"]'
      );

      if(pageCell){
        pageCell.textContent=currentPage;
      }

      const height=clone.getBoundingClientRect().height;

      const pagesUsed=Math.max(
        1,
        Math.ceil((height-2)/pageHeight)
      );

      currentPage+=pagesUsed;
    });

    /*
      Remove the measurement copy.
    */
    measure.remove();

    /*
      Allow the cover numbers to update before printing.
    */
    setTimeout(()=>{
      window.print();
    },200);

  });
}
 
function printControl(){
  const s=svc();

  const completeAll=scenarios.every((name,i)=>{
    const answers=Array.isArray(s.scenarioAnswers?.[i])
      ? s.scenarioAnswers[i]
      : [];

    return answers.length>=8 &&
      answers.slice(0,8).every(a=>String(a||"").trim().length>0);
  });

  const completedCount=scenarios.filter((name,i)=>{
    const answers=Array.isArray(s.scenarioAnswers?.[i])
      ? s.scenarioAnswers[i]
      : [];

    return answers.length>=8 &&
      answers.slice(0,8).every(a=>String(a||"").trim().length>0);
  }).length;

  if(!completeAll){
  return `

      <div class="card">
        <h2>Business Continuity Plan</h2>

        <div class="alert">
          <b>Business Continuity Plan not ready to print</b><br><br>

          ${completedCount} of ${scenarios.length} continuity scenarios
          have been completed.

          <br><br>

          All ${scenarios.length} scenarios must be completed before the
          emergency grab-bag copy can be printed.
        </div>

        <div class="actions no-print" style="margin-top:14px">
          <button class="btn primary"
                  onclick="setScreen('scenarios')">
            Return to Continuity Scenarios
          </button>

          <button class="btn"
                  onclick="setScreen('servicehome')">
            Back to Service
          </button>
        </div>
      </div>

    `;
  }

  const questions=[
    "What should happen first?",
    "Who needs to be contacted, and how?",
    "Who is most affected by this disruption?",
    "What equipment, information or documents might be needed?",
    "Where is everything located?",
    "What alternative arrangements would be needed?",
    "What could make this situation worse?",
    "What would someone unfamiliar with this service need to know?"
  ];

 return `

    <!-- EMERGENCY COVER -->

    <div class="print-cover" style="
      min-height:900px;
      padding:28px;
      border:1px solid var(--line);
      border-radius:12px;
      background:#fff;
      page-break-after:always;
      box-sizing:border-box;
    ">

      <div style="
        border:2px solid var(--brand);
        border-radius:12px;
        padding:22px;
        margin-bottom:20px;
      ">

        <div style="
          font-size:30px;
          font-weight:800;
          color:var(--brand);
        ">
          BUSINESS CONTINUITY PLAN
        </div>

        <div style="
          font-size:22px;
          font-weight:800;
          margin-top:8px;
        ">
          EMERGENCY — START HERE
        </div>

        <div style="
          margin-top:18px;
          font-size:17px;
        ">
          <b>Service:</b> ${esc(s.name)}
        </div>

        <div style="
          margin-top:6px;
          font-size:17px;
        ">
          <b>Last updated:</b> ${esc(s.lastUpdate||"")}
        </div>

      </div>

      <div class="alert" style="font-size:15px;margin-bottom:20px">
        <b>If something unexpected happens at the service</b><br><br>

        Use this page to find the information you need quickly.
        Find what has happened below and go directly to the page shown.
      </div>

      <div class="card" style="margin-top:0">
        <h2>FIND THE INFORMATION YOU NEED</h2>

        <table class="table" style="width:100%">
          <tr>
            <th>What has happened?</th>
            <th style="width:110px;text-align:center">Go to page</th>
          </tr>

          ${scenarios.map((name,i)=>`
  <tr>
    <td>
      <b>${i+1}. ${esc(name)}</b>
    </td>

    <td style="
      width:110px;
      text-align:center;
      font-size:20px;
      font-weight:800;
    ">
      <span data-page="${i}">—</span>
    </td>
  </tr>
`).join("")}
        </table>
      </div>

      <div style="
        margin-top:22px;
        padding:16px;
        border:2px solid var(--brand);
        border-radius:10px;
        background:#f8fafc;
      ">
        <b>If you cannot find what you need</b><br><br>

        Speak to the <b>Manager or on-call manager</b> immediately
        and follow their instructions.
      </div>

    </div>


    <!-- BCP INFORMATION PAGE -->

    <div class="print-intro" style="
      page-break-after:always;
      min-height:900px;
    ">

      <div class="card">
        <h2>Business Continuity Plan</h2>

        <table class="table">

          <tr>
            <th>Service</th>
            <td>${esc(s.name)}</td>
          </tr>

          <tr>
            <th>Region</th>
            <td>${esc(s.region||"")}</td>
          </tr>

          <tr>
            <th>Division</th>
            <td>${esc(s.division||"")}</td>
          </tr>

          <tr>
            <th>Area</th>
            <td>${esc(s.area||"")}</td>
          </tr>

          <tr>
            <th>Last updated</th>
            <td>${esc(s.lastUpdate||"")}</td>
          </tr>

          <tr>
            <th>Next review</th>

          </tr>

        </table>
      </div>

      <div class="success">
        <b>Grab-bag copy</b><br>
        This document contains the current service-specific contingency
        arrangements recorded in the Business Continuity Plan.
      </div>

      <div class="card">
        <h2>Continuity scenarios</h2>

        <p class="small">
          The following pages contain the service-specific arrangements
          for each continuity scenario.
        </p>

        <p class="small">
          Use the emergency cover sheet at the front of this document
          to find the relevant page quickly.
        </p>
      </div>

    </div>


    <!-- ALL 17 SCENARIOS -->

    ${scenarios.map((name,i)=>{

      const answers=Array.isArray(s.scenarioAnswers?.[i])
        ? s.scenarioAnswers[i]
        : [];

      const images=Array.isArray(s.scenarioImages?.[i])
        ? s.scenarioImages[i]
        : [];

      return `

        <div
          class="print-scenario"

          style="
            page-break-before:always;
            page-break-inside:auto;
          "
        >

          <div class="card">

            <h2>
              Scenario ${i+1}: ${esc(name)}

            ${questions.map((question,n)=>`

              <div style="
                margin-top:16px;
                page-break-inside:avoid;
              ">

                <b>${n+1}. ${esc(question)}</b>

                <div style="
                  margin-top:7px;
                  padding:11px;
                  border:1px solid var(--line);
                  border-radius:7px;
                  background:#f8fafc;
                  white-space:pre-wrap;
                ">${esc(answers[n]||"")}</div>

              </div>

            `).join("")}


            ${images.length ? `

              <div style="
                margin-top:22px;
                page-break-inside:avoid;
              ">

                <h3>Scenario images</h3>

                ${images.map((img)=>`

                  <div style="
                    margin-top:14px;
                    page-break-inside:avoid;
                  ">

                    <img
                      src="${esc(img.url)}"
                      alt="${esc(img.caption||"Scenario image")}"
                      style="
                        max-width:100%;
                        max-height:300px;
                        border:1px solid var(--line);
                        border-radius:7px;
                      "
                    >

                    ${img.caption ? `
                      <div class="small" style="margin-top:5px">
                        <b>${esc(img.caption)}</b>
                      </div>
                    ` : ""}

                  </div>

                `).join("")}

              </div>

            ` : ""}

          </div>

        </div>

      `;

    }).join("")}


    <!-- PRINT CONTROL -->

    <div class="card no-print" style="margin-top:18px">

      <h3>Print / Grab-bag control</h3>

      <p class="small">
        Before replacing the physical grab-bag copy, confirm that the
        current Business Continuity Plan has been printed and the previous
        version removed.
      </p>

      <label>
        <input type="checkbox">
        Current BCP printed
      </label><br>

      <label>
        <input type="checkbox">
        Old grab-bag copy removed
      </label><br>

      <label>
        <input type="checkbox">
        New copy placed in grab bag
      </label><br>

      <label>
        <input type="checkbox">
        Update / print date recorded
      </label><br>

      <label>
        <input type="checkbox">
        Manager or delegated person confirms replacement
      </label>

    </div>

    <div class="actions no-print" style="margin-top:14px">

      <button class="btn primary"
              onclick="preparePrint()">
        Print Business Continuity Plan
      </button>

      <button class="btn"
              onclick="setScreen('servicehome')">
        Back to Service
      </button>

    </div>

  `;
}
