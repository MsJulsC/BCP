<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BCP Builder — Version 8</title>
<style>
:root{--ink:#1f2937;--muted:#64748b;--line:#d8dee7;--panel:#f7f9fc;--brand:#1f4e79;--accent:#0f766e;--warn:#a16207;--danger:#b42318;--ok:#166534;--white:#fff}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#eef2f6;color:var(--ink)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{max-width:1280px;margin:0 auto;padding:22px}.topbar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px 18px;display:flex;gap:16px;align-items:center;justify-content:space-between;box-shadow:0 2px 8px #0000000a}
.brand{font-size:21px;font-weight:700;color:var(--brand)}.sub{font-size:12px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #b8c3d1;background:#fff;border-radius:8px;padding:9px 12px;color:var(--ink)}.btn:hover{background:#f5f7fa}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.teal{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.warn{background:#fff7df;border-color:#e2b94d;color:#7c5200}.btn.danger{background:#fff0ef;border-color:#e2a29d;color:#9d241a}
.statusbar{margin-top:12px;padding:10px 14px;border-radius:9px;border:1px solid #b7d7c2;background:#edf9f0;color:var(--ok);font-size:13px}.statusbar.warn{border-color:#e2b94d;background:#fff8e6;color:#7c5200}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:14px;box-shadow:0 2px 8px #00000008}
h1{font-size:24px;margin:0 0 6px;color:var(--brand)}h2{font-size:18px;margin:0 0 8px}h3{font-size:14px;margin:16px 0 7px}.lead{color:#475569;line-height:1.5}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px}.metric b{display:block;font-size:21px}.metric span{font-size:11px;color:var(--muted)}
.dashboard-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:14px}.service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.service-card{border:1px solid var(--line);border-radius:11px;padding:15px;background:#fff;cursor:pointer}.service-card:hover{border-color:#8aa6c2;box-shadow:0 3px 12px #0000000d}.service-card h3{margin:0 0 8px;font-size:16px;color:var(--brand)}
.badge{font-size:11px;border-radius:999px;padding:4px 8px;display:inline-block;font-weight:700}.badge.ok{background:#e8f5ed;color:var(--ok)}.badge.warn{background:#fff2d6;color:#805500}.badge.danger{background:#fde9e7;color:#a02b22}.badge.info{background:#e8f0fb;color:#285b91}
.service-meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:12px}.service-meta div{background:#f8fafc;border-radius:7px;padding:8px}.service-meta b{display:block;font-size:15px}.service-meta span{font-size:10px;color:var(--muted)}
.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid #c7d0dc;border-radius:7px;padding:9px;background:#fff}.field textarea{min-height:72px;resize:vertical}
.scenario{border:1px solid var(--line);border-radius:9px;margin:8px 0;overflow:hidden}.scenario-head{padding:12px;background:#f7f9fc;display:flex;justify-content:space-between;align-items:center;gap:10px}.scenario-head b{font-size:14px}.pill{font-size:11px;border-radius:999px;padding:4px 8px;background:#e8f5ed;color:var(--ok)}.pill.open{background:#fff2d6;color:#805500}.scenario-body{padding:14px}.prompt{background:#f8fafc;border-left:4px solid var(--brand);padding:10px;margin:8px 0}.prompt b{font-size:12px}.small{font-size:12px;color:var(--muted)}
.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{border:1px solid var(--line);padding:8px;vertical-align:top;text-align:left}.table th{background:#f1f5f9}.table tr.clickable{cursor:pointer}.table tr.clickable:hover{background:#f8fafc}
.flow{display:flex;gap:7px;align-items:stretch;flex-wrap:wrap}.flow .step{flex:1;min-width:130px;border:1px solid var(--line);background:#f8fafc;border-radius:9px;padding:10px;text-align:center;font-size:12px}.arrow{align-self:center;color:var(--brand);font-weight:700}
.alert{border:1px solid #e2b94d;background:#fff8e6;border-radius:9px;padding:12px;color:#7c5200}.success{border:1px solid #b7d7c2;background:#edf9f0;border-radius:9px;padding:12px;color:var(--ok)}.dangerbox{border:1px solid #e2a29d;background:#fff0ef;border-radius:9px;padding:12px;color:#9d241a}
.bar{height:9px;border-radius:99px;background:#e8edf3;overflow:hidden}.bar>span{display:block;height:100%;background:#1f4e79}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}.section-title{display:flex;justify-content:space-between;gap:10px;align-items:center}
.footer{color:#718096;font-size:11px;padding:18px 2px;text-align:center}.hidden{display:none!important}
@media(max-width:900px){.grid,.fieldgrid,.service-grid,.dashboard-grid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.grid,.fieldgrid,.service-grid,.dashboard-grid{grid-template-columns:1fr}.app{padding:10px}.topbar{align-items:flex-start;flex-direction:column}}
@media print{body{background:#fff}.app{max-width:none;padding:0}.no-print{display:none!important}.card{box-shadow:none;break-inside:avoid}.topbar{box-shadow:none}}
</style>
</head>

let currentService="oak",screen="overview";
let serviceData=JSON.parse(localStorage.getItem("bcp8_services")||"null")||JSON.parse(JSON.stringify(demoServices));

function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}
function save(){localStorage.setItem("bcp8_services",JSON.stringify(serviceData));}
function today(){return new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit",year:"numeric"});}
function svc(){return serviceData[currentService];}
function setScreen(s){screen=s;render();window.scrollTo({top:0,behavior:"smooth"});}
function setService(id){currentService=id;screen="serviceHome";render();window.scrollTo({top:0,behavior:"smooth"});}
function badge(status,text){return `<span class="badge ${status}">${text}</span>`;}
function header(title,serviceMode=false){
 const s=svc();
 return `<div class="topbar">
 <div><div class="brand">Business Continuity Plan Builder</div><div class="sub">${serviceMode?`Service: ${esc(s.name)}`:"Organisational Business Continuity Plan Overview"} • Version 8 prototype</div></div>
 <div class="actions no-print">
 <button class="btn" onclick="setScreen('overview')">Overview</button>
 ${serviceMode?`<button class="btn" onclick="setScreen('serviceHome')">Service Home</button><button class="btn" onclick="setScreen('learning')">Learning Log</button><button class="btn" onclick="printBCP()">Print BCP</button>`:""}
 </div></div>
 ${serviceMode&&s.lastUpdate!==s.printed?`<div class="statusbar warn">⚠ <b>PRINT REQUIRED</b> — ${esc(s.name)} has changed since its grab-bag copy was printed.</div>`:serviceMode?`<div class="statusbar">✓ Grab-bag copy current — live BCP matches printed version for ${esc(s.name)}.</div>`:""}
 <div class="card"><h1>${title}</h1></div>`;
}

function overview(){
 const list=Object.values(serviceData), current=list.filter(s=>s.review==="Current").length, overdue=list.filter(s=>s.review==="Overdue").length;
 const actions=list.reduce((a,s)=>a+s.actions,0), events=list.reduce((a,s)=>a+s.events,0);
 const allLogs=list.flatMap(s=>s.learning.map(l=>({...l,service:s.name})));
 const themeCounts={};
 allLogs.forEach(l=>{if(l.learning.toLowerCase().includes("alternative accommodation"))themeCounts["Alternative accommodation"]=(themeCounts["Alternative accommodation"]||0)+1;
 if(l.learning.toLowerCase().includes("staff"))themeCounts["Staffing contingency"]=(themeCounts["Staffing contingency"]||0)+1;
 if(l.learning.toLowerCase().includes("grab-bag")||l.learning.toLowerCase().includes("grab bag"))themeCounts["Grab-bag assurance"]=(themeCounts["Grab-bag assurance"]||0)+1;
 if(l.scenario==="Loss of Electricity")themeCounts["Loss of electricity"]=(themeCounts["Loss of electricity"]||0)+1;});
 const themes=Object.entries(themeCounts).sort((a,b)=>b[1]-a[1]);
 return header("Organisational Business Continuity Plan Overview")+`
 <div class="card">
  <div class="kicker">Live assurance position — demonstration data</div>
  <p class="lead">A single view of service BCP status, learning, actions and recurring themes. Select a service to open its BCP and follow learning back into the relevant continuity scenario.</p>
  <div class="grid">
   <div class="metric"><b>${current}/${list.length}</b><span>BCPs current</span></div>
   <div class="metric"><b>${overdue}</b><span>Review overdue</span></div>
   <div class="metric"><b>${actions}</b><span>Open learning actions</span></div>
   <div class="metric"><b>${events}</b><span>Recorded events / tests</span></div>
  </div>
 </div>

<div class="card">
 <h2>Organisational structure</h2>
 <p class="lead">Select a region to view its divisions, areas and services.</p>

 ${[
  {
   region:"Region A",
   divisions:[
    {name:"Division 1",areas:["Alpha","Bravo","Charlie","Delta","Echo"]},
    {name:"Division 2",areas:["Foxtrot","Golf","Hotel","India","Juliet"]}
   ]
  },
  {
   region:"Region B",
   divisions:[
    {name:"Division 3",areas:["Kilo","Lima","Mike","November","Oscar"]},
    {name:"Division 4",areas:["Papa","Quebec","Romeo","Sierra","Tango"]}
   ]
  }
 ].map(r=>`
  <details>
   <summary><b>${r.region}</b></summary>

   <div style="margin:12px 0 0 18px">

    ${r.divisions.map(d=>`
     <details>
      <summary><b>${d.name}</b></summary>

      <div style="margin:10px 0 10px 18px">

       ${d.areas.map(area=>`
        <details>
         <summary><b>${area}</b></summary>

         <div style="margin:10px 0 10px 18px">

          ${
           Object.entries(serviceData)
            .filter(([id,s])=>
             s.region===r.region &&
             s.division===d.name &&
             s.area===area
            )
            .map(([id,s])=>`
             <p>
              <button class="btn" onclick="setService('${id}')">
               ${esc(s.name)}
              </button>
             </p>
            `).join("")
           ||
           `<p class="small">No services added yet.</p>`
          }

         </div>
        </details>

async function saveFullScenario(){
  const s=svc();
  const i=s.currentScenario||0;

  s.answers=Array.isArray(s.answers)?s.answers:[];
  s.answers[i]=document.getElementById("fullsc").value;

 s.scenarioImages=Array.isArray(s.scenarioImages)?s.scenarioImages:[];
const images=Array.isArray(s.scenarioImages[i])?s.scenarioImages[i]:[];

  const files=[];

  for(let n=0;n<5;n++){
    const input=document.getElementById("img_"+n);
    const caption=document.getElementById("imgcap_"+n)?.value.trim();

    files.push({
      file:input?.files?.[0]||null,
      caption,
      existing:images[n]?.url||""
    });
  }

  const readFile=file=>new Promise(resolve=>{
    if(!file){
      resolve("");
      return;
    }

    const reader=new FileReader();
    reader.onload=e=>resolve(e.target.result);
    reader.readAsDataURL(file);
  });

  const newImages=[];

  for(const item of files){
    const url=await readFile(item.file);

    if(url){
      newImages.push({
        url,
        caption:item.caption
      });
    }else if(item.existing){
      newImages.push({
        url:item.existing,
        caption:item.caption
      });
    }
  }

 s.scenarioImages[i]=newImages;
  s.lastUpdate=today();

  save();
  setScreen("scenarios");
}

function newLog(type){
const s=svc(),n=prompt("Which continuity scenario?\n\n"+scenarios.map((name,i)=>(i+1)+". "+name).join("\n")+"\n\nEnter the scenario number:");
 if(!n)return;let i=Math.max(1,Math.min(scenarios.length,parseInt(n,10)||1))-1;
 const learning=prompt("What happened / what did you learn?");if(learning===null)return;
 const update=confirm("Does this learning require the BCP to be updated?\\n\\nOK = YES\\nCancel = NO")?"YES":"NO";
 s.learning.unshift({date:today(),type,scenario:scenarios[i],learning,update,action:update==="YES"?"Update BCP Scenario":"Closed"});
 s.events++;if(update==="YES")s.actions++;save();render();
}
